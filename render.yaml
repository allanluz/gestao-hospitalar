# Render Configuration (Blueprint)
# https://render.com/docs/yaml-spec

services:
  # Backend API Service
  - type: web
    name: gestao-hospitalar-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
